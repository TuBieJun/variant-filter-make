# Optional parameter file for the workflow.
# This file is provided for reference and is not automatically loaded
# by the Snakefile unless you add it to config/config.yaml.

info_tags:
  - DP
  - QD
  - MQ
  - FS

models:
  - name: linear_svm
    type: svm
    params:
      kernel: linear
      C: 1.0
      probability: true
  - name: logistic
    type: logistic
    params:
      solver: lbfgs
      max_iter: 1000
  - name: random_forest
    type: random_forest
    params:
      n_estimators: 100
      max_depth: 10
      random_state: 42

thresholds:
  linear_svm: 0.5
  logistic: 0.5
  random_forest: 0.5

plot_metrics:
  - precision
  - recall
  - f1
