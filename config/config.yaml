reference_genome: /data/public_db/human_reference/b37/human_g1k_v37.fasta
output_dir: results
info_tags:
  - DP
  - QD
  - MQ
  - FS
models:
  - name: linear_svm
    type: svm
    params:
      kernel: linear
      C: 1.0
      probability: true
  - name: logistic
    type: logistic
    params:
      solver: lbfgs
      max_iter: 1000
  - name: random_forest
    type: random_forest
    params:
      n_estimators: 100
      max_depth: 10
      random_state: 42
thresholds:
  linear_svm: 0.5
  logistic: 0.5
  random_forest: 0.5
plot_metrics:
  - precision
  - recall
  - f1
training_sets:
  - sample_id: NA12878
    vcf: /data/users/liteng/my_dev/product/wegene_basic_data_bench/data/NA12878304_T7_phase1_8G/NA12878304_T7_phase1_8G.vcf.gz
    bed: /data/users/liteng/my_dev/product/wegene_basic_data_bench/beds/itech_mt_NA12878_highconf_v4.2.1.bed
    truth_vcf: /data/public_db/giab/GRCH37/latest/NA12878_benchmark.vcf.gz
  - sample_id: NA24694
    vcf: /data/users/liteng/my_dev/product/wegene_basic_data_bench/data/NA246940317366_T7_phase1_8G/NA246940317366_T7_phase1_8G.vcf.gz
    bed: /data/users/liteng/my_dev/product/wegene_basic_data_bench/beds/itech_mt_NA24694_highconf_v4.2.1.bed
    truth_vcf: /data/public_db/giab/GRCH37/latest/NA24694_benchmark.vcf.gz
test_sets:
  - sample_id: NA24385
    vcf: /data/users/liteng/my_dev/product/wegene_basic_data_bench/data/NA243850324384_T7_phase1_8G/NA243850324384_T7_phase1_8G.vcf.gz
    bed: /data/users/liteng/my_dev/product/wegene_basic_data_bench/beds/itech_mt_NA24385_highconf_v4.2.1.bed
    truth_vcf: /data/public_db/giab/GRCH37/latest/NA24385_benchmark.vcf.gz
